openapi: "3.0.3"
info:
  title: "RockerStore API"
  version: "1.0.0"
  description: "Documentação baseada no código Laravel do RockerStore (branch main, commit e073f42). API com sessão Laravel/Sanctum, cookies e proteção CSRF; não emite Bearer no login. Antes de operações de escrita, a UI inicializa /sanctum/csrf-cookie e envia X-XSRF-TOKEN. Em todas as requisições Try it out são enviados cookies do mesmo host. Valores em centavos. Algumas rotas retornam Resources dentro de `data` e `/user` retorna o Model diretamente. Apenas rotas realmente registradas foram documentadas."
servers:
  -
    url: "/api"
    description: "Mesmo host Apache da documentação. Prefixo /api incluído apenas uma vez."
tags:
  -
    name: "Autenticação"
    description: "Registro, login e sessão web por cookie; logout e usuário atual."
  -
    name: "Catálogo"
    description: "Catálogo público de produtos ativos."
  -
    name: "Categorias"
    description: "Categorias públicas e gestão administrativa."
  -
    name: "Carrinho"
    description: "Carrinho anônimo persistente e carrinho vinculado à conta."
  -
    name: "Endereços"
    description: "Endereços do usuário autenticado."
  -
    name: "Pedidos"
    description: "Checkout, pagamento simulado, cancelamento e histórico."
  -
    name: "Administração"
    description: "Endpoints protegidos por middleware admin."
  -
    name: "Sessão/CSRF"
    description: "Endpoint auxiliar do Sanctum para inicialização do cookie CSRF."
paths:
  "/sanctum/csrf-cookie":
    get:
      tags:
        - "Sessão/CSRF"
      summary: "Inicializar cookies e proteção CSRF"
      description: "Endpoint real do Sanctum, fora de `/api`. Antes das operações POST/PUT/PATCH/DELETE, a interface obtém XSRF-TOKEN por aqui. Não usa Bearer."
      responses:
        "204":
          description: "Cookies XSRF-TOKEN e sessão enviados; sem corpo."
      servers:
        -
          url: "/"
  "/auth/register":
    post:
      tags:
        - "Autenticação"
      summary: "Cadastrar cliente e fundir carrinho"
      description: "Público. Cria usuário com role `cliente`, efetua login por sessão e mescla carrinho anônimo. O campo role é proibido. CSRF obrigatório em requisições stateful."
      responses:
        "201":
          description: "Usuário registrado e autenticado por cookie."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RegisterResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "422":
          description: "Entrada inválida ou regra de negócio violada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationError"
              examples:
                invalid_quantity:
                  summary: "Exemplo de erro de validação"
                  value:
                    message: "The quantity field must be at least 1."
                    errors:
                      quantity:
                        - "The quantity field must be at least 1."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
            examples:
              valid:
                summary: "Cadastro válido"
                value:
                  name: "Cliente Novo"
                  email: "novo@example.com"
                  password: "senha-segura-123"
                  password_confirmation: "senha-segura-123"
              invalid:
                summary: "Inválido: confirmação diferente"
                value:
                  name: "Cliente Novo"
                  email: "novo@example.com"
                  password: "senha-segura-123"
                  password_confirmation: "outra-senha"
  "/auth/login":
    post:
      tags:
        - "Autenticação"
      summary: "Entrar na conta e fundir carrinho"
      description: "Público. Autentica via sessão web do Laravel; renova a sessão e mescla carrinho do visitante, avisando ajustes de estoque. Não retorna token Bearer."
      responses:
        "200":
          description: "Login concluído; cookie de sessão ativo."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LoginResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "422":
          description: "Entrada inválida ou regra de negócio violada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationError"
              examples:
                invalid_quantity:
                  summary: "Exemplo de erro de validação"
                  value:
                    message: "The quantity field must be at least 1."
                    errors:
                      quantity:
                        - "The quantity field must be at least 1."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
            examples:
              valid:
                summary: "Credenciais"
                value:
                  email: "cliente@example.com"
                  password: "senha-segura"
              invalid:
                summary: "E-mail inválido"
                value:
                  email: "nao-e-email"
                  password: "x"
  "/auth/logout":
    post:
      tags:
        - "Autenticação"
      summary: "Encerrar sessão"
      description: "Autenticado. Invalida a sessão web, sem token Bearer."
      responses:
        "200":
          description: "Sessão encerrada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SimpleMessage"
        "401":
          description: "Não autenticado; sessão ausente ou expirada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/user":
    get:
      tags:
        - "Autenticação"
      summary: "Usuário atual"
      description: "Autenticado. Retorna diretamente o Model User serializado, sem envelope `data` e sem senha."
      responses:
        "200":
          description: "Usuário corrente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "401":
          description: "Não autenticado; sessão ausente ou expirada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/categories":
    get:
      tags:
        - "Categorias"
      summary: "Listar categorias"
      description: "Público. Lista em ordem alfabética."
      responses:
        "200":
          description: "Coleção de categorias."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CategoryList"
  "/admin/categories":
    post:
      tags:
        - "Administração"
      summary: "Criar categoria"
      description: "Apenas admin. Nome obrigatório, único, máximo 120 caracteres; slug gerado automaticamente."
      responses:
        "201":
          description: "Categoria criada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CategoryWriteResponse"
        "401":
          description: "Não autenticado; sessão ausente ou expirada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "Operação proibida para este usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "422":
          description: "Entrada inválida ou regra de negócio violada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationError"
              examples:
                invalid_quantity:
                  summary: "Exemplo de erro de validação"
                  value:
                    message: "The quantity field must be at least 1."
                    errors:
                      quantity:
                        - "The quantity field must be at least 1."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CategoryWrite"
            examples:
              valid:
                summary: "Válido"
                value:
                  name: "Teclados"
              invalid:
                summary: "Inválido: sem nome"
                value: {}
  "/admin/categories/{category}":
    put:
      tags:
        - "Administração"
      summary: "Atualizar categoria"
      description: "Apenas admin. Exige `name` obrigatório. Slug é recalculado."
      responses:
        "200":
          description: "Categoria atualizada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CategoryWriteResponse"
        "401":
          description: "Não autenticado; sessão ausente ou expirada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "Operação proibida para este usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "Recurso inexistente, inativo ou fora do escopo do usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "422":
          description: "Entrada inválida ou regra de negócio violada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationError"
              examples:
                invalid_quantity:
                  summary: "Exemplo de erro de validação"
                  value:
                    message: "The quantity field must be at least 1."
                    errors:
                      quantity:
                        - "The quantity field must be at least 1."
      parameters:
        -
          name: "category"
          in: "path"
          required: true
          schema:
            type: "integer"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CategoryWrite"
    delete:
      tags:
        - "Administração"
      summary: "Excluir categoria"
      description: "Apenas admin. Se existir produto vinculado à categoria, retorna 409."
      responses:
        "200":
          description: "Categoria excluída."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SimpleMessage"
        "401":
          description: "Não autenticado; sessão ausente ou expirada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "Operação proibida para este usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "Recurso inexistente, inativo ou fora do escopo do usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflito de regra de negócio ou transição inválida."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      parameters:
        -
          name: "category"
          in: "path"
          required: true
          schema:
            type: "integer"
  "/products":
    get:
      tags:
        - "Catálogo"
      summary: "Listar catálogo público"
      description: "Produtos ativos e não excluídos, ordenados por nome com 12 por página. A versão atual NÃO implementa parâmetro de ordenação; filtros são os definidos por ListProductsRequest."
      responses:
        "200":
          description: "Lista paginada de produtos."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductPage"
        "422":
          description: "Entrada inválida ou regra de negócio violada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationError"
              examples:
                invalid_quantity:
                  summary: "Exemplo de erro de validação"
                  value:
                    message: "The quantity field must be at least 1."
                    errors:
                      quantity:
                        - "The quantity field must be at least 1."
      parameters:
        -
          name: "search"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Pesquisa pelo nome (até 100 caracteres)."
        -
          name: "category_id"
          in: "query"
          required: false
          schema:
            type: "integer"
          description: "Categoria existente."
        -
          name: "min_price_cents"
          in: "query"
          required: false
          schema:
            type: "integer"
          description: "Preço mínimo em centavos."
        -
          name: "max_price_cents"
          in: "query"
          required: false
          schema:
            type: "integer"
          description: "Preço máximo em centavos; deve ser >= mínimo, se enviado."
        -
          name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
          description: "Página 1 ou maior."
  "/products/{product}":
    get:
      tags:
        - "Catálogo"
      summary: "Detalhe público do produto"
      description: "Somente produto ativo. Produtos inativos ou excluídos retornam 404."
      responses:
        "200":
          description: "Produto encontrado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductEnvelope"
        "404":
          description: "Recurso inexistente, inativo ou fora do escopo do usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      parameters:
        -
          name: "product"
          in: "path"
          required: true
          schema:
            type: "integer"
  "/admin/products":
    post:
      tags:
        - "Administração"
      summary: "Cadastrar produto"
      description: "Apenas admin. Valores monetários em centavos; `image_path` é string, não upload multipart."
      responses:
        "201":
          description: "Produto criado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductWriteResponse"
        "401":
          description: "Não autenticado; sessão ausente ou expirada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "Operação proibida para este usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "422":
          description: "Entrada inválida ou regra de negócio violada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationError"
              examples:
                invalid_quantity:
                  summary: "Exemplo de erro de validação"
                  value:
                    message: "The quantity field must be at least 1."
                    errors:
                      quantity:
                        - "The quantity field must be at least 1."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ProductWrite"
            examples:
              valid:
                summary: "Válido"
                value:
                  category_id: 1
                  name: "Guitarra Nova"
                  description: "Modelo clássico"
                  price_cents: 189990
                  stock_quantity: 3
                  is_active: true
              invalid:
                summary: "Inválido: preço negativo"
                value:
                  category_id: 1
                  name: "Guitarra Nova"
                  price_cents: -10
                  stock_quantity: 3
  "/admin/products/{product}":
    put:
      tags:
        - "Administração"
      summary: "Atualizar produto"
      description: "Apenas admin. Campos opcionais; campos presentes são validados."
      responses:
        "200":
          description: "Produto atualizado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductWriteResponse"
        "401":
          description: "Não autenticado; sessão ausente ou expirada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "Operação proibida para este usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "Recurso inexistente, inativo ou fora do escopo do usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "422":
          description: "Entrada inválida ou regra de negócio violada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationError"
              examples:
                invalid_quantity:
                  summary: "Exemplo de erro de validação"
                  value:
                    message: "The quantity field must be at least 1."
                    errors:
                      quantity:
                        - "The quantity field must be at least 1."
      parameters:
        -
          name: "product"
          in: "path"
          required: true
          schema:
            type: "integer"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ProductUpdate"
            examples:
              valid:
                summary: "Alterar estoque"
                value:
                  stock_quantity: 10
              invalid:
                summary: "Inválido: estoque negativo"
                value:
                  stock_quantity: -1
    delete:
      tags:
        - "Administração"
      summary: "Excluir produto logicamente"
      description: "Apenas admin. Soft delete; preserva histórico dos pedidos."
      responses:
        "200":
          description: "Produto excluído."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SimpleMessage"
        "401":
          description: "Não autenticado; sessão ausente ou expirada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "Operação proibida para este usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "Recurso inexistente, inativo ou fora do escopo do usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      parameters:
        -
          name: "product"
          in: "path"
          required: true
          schema:
            type: "integer"
  "/cart":
    get:
      tags:
        - "Carrinho"
      summary: "Ver carrinho atual"
      description: "Público, com ou sem login. Carrinho anônimo identificado pelo cookie persistente `rockerstore_guest_cart`; valores são recalculados usando o preço atual."
      responses:
        "200":
          description: "Carrinho do visitante ou usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CartEnvelope"
  "/cart/items":
    post:
      tags:
        - "Carrinho"
      summary: "Adicionar ao carrinho"
      description: "Público, sessão/cookies stateful. Itens repetidos somam quantidades. Produto inativo/fora do catálogo retorna 404; falta de estoque retorna 422."
      responses:
        "200":
          description: "Carrinho atualizado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CartEnvelope"
        "404":
          description: "Recurso inexistente, inativo ou fora do escopo do usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "422":
          description: "Entrada inválida ou regra de negócio violada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationError"
              examples:
                invalid_quantity:
                  summary: "Exemplo de erro de validação"
                  value:
                    message: "The quantity field must be at least 1."
                    errors:
                      quantity:
                        - "The quantity field must be at least 1."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CartAdd"
            examples:
              valid:
                summary: "Adicionar duas unidades"
                value:
                  product_id: 1
                  quantity: 2
              invalid:
                summary: "Inválido: quantidade zero"
                value:
                  product_id: 1
                  quantity: 0
  "/cart/items/{item}":
    put:
      tags:
        - "Carrinho"
      summary: "Definir quantidade do item"
      description: "Público. Quantidade zero remove o item. Só permite modificar itens do carrinho identificado por cookie/sessão."
      responses:
        "200":
          description: "Carrinho atualizado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CartEnvelope"
        "404":
          description: "Recurso inexistente, inativo ou fora do escopo do usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "422":
          description: "Entrada inválida ou regra de negócio violada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationError"
              examples:
                invalid_quantity:
                  summary: "Exemplo de erro de validação"
                  value:
                    message: "The quantity field must be at least 1."
                    errors:
                      quantity:
                        - "The quantity field must be at least 1."
      parameters:
        -
          name: "item"
          in: "path"
          required: true
          schema:
            type: "integer"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CartUpdate"
            examples:
              valid:
                summary: "Remover com quantidade zero"
                value:
                  quantity: 0
              invalid:
                summary: "Inválido: quantidade negativa"
                value:
                  quantity: -1
    delete:
      tags:
        - "Carrinho"
      summary: "Remover item"
      description: "Público. Remove somente um item pertencente ao carrinho atual."
      responses:
        "200":
          description: "Carrinho atualizado."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CartEnvelope"
        "404":
          description: "Recurso inexistente, inativo ou fora do escopo do usuário."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "419":
          description: "Token CSRF ausente/expirado em requisição de escrita."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      parameters:
        -
          name: "item"
          in: "path"
          required: true
          schema:
            type: "integer"
  "/addresses":
    get:
      tags:
        - "Endereços"
      summary: "Listar meus endereços"
      description: "Autenticado. Lista apenas endereços do usuário, mais recentes primeiro."
      responses:
