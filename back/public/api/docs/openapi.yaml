components:
  schemas:
    User:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        email:
          type: "string"
          format: "email"
        role:
          type: "string"
          enum:
            - "cliente"
            - "admin"
        email_verified_at:
          type: "string"
          format: "date-time"
          nullable: true
        created_at:
          type: "string"
          format: "date-time"
          nullable: true
        updated_at:
          type: "string"
          format: "date-time"
          nullable: true
      required:
        - "id"
        - "name"
        - "email"
        - "role"
    LoginUser:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        email:
          type: "string"
          format: "email"
        role:
          type: "string"
          enum:
            - "cliente"
            - "admin"
      required:
        - "id"
        - "name"
        - "email"
        - "role"
    MergeWarning:
      type: "object"
      properties:
        product_id:
          type: "integer"
        message:
          type: "string"
        requested_quantity:
          type: "integer"
        applied_quantity:
          type: "integer"
      required:
        - "product_id"
        - "message"
    Merge:
      type: "object"
      properties:
        warnings:
          type: "array"
          items:
            "$ref": "#/components/schemas/MergeWarning"
      required:
        - "warnings"
    RegisterResponse:
      type: "object"
      properties:
        message:
          type: "string"
        data:
          type: "object"
          properties:
            id:
              type: "integer"
            name:
              type: "string"
            email:
              type: "string"
            role:
              type: "string"
            cart_merge:
              "$ref": "#/components/schemas/Merge"
          required:
            - "id"
            - "name"
            - "email"
            - "role"
            - "cart_merge"
      required:
        - "message"
        - "data"
    LoginResponse:
      type: "object"
      properties:
        message:
          type: "string"
        data:
          type: "object"
          properties:
            user:
              "$ref": "#/components/schemas/LoginUser"
            cart_merge:
              "$ref": "#/components/schemas/Merge"
          required:
            - "user"
            - "cart_merge"
      required:
        - "message"
        - "data"
    SimpleMessage:
      type: "object"
      properties:
        message:
          type: "string"
      required:
        - "message"
    Category:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        slug:
          type: "string"
      required:
        - "id"
        - "name"
        - "slug"
    Product:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        price_cents:
          type: "integer"
        stock_quantity:
          type: "integer"
        image_path:
          type: "string"
          nullable: true
        category:
          "$ref": "#/components/schemas/Category"
      required:
        - "id"
        - "name"
        - "price_cents"
        - "stock_quantity"
        - "category"
    CartProduct:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        price_cents:
          type: "integer"
        stock_quantity:
          type: "integer"
        is_active:
          type: "boolean"
      required:
        - "id"
        - "name"
        - "price_cents"
        - "stock_quantity"
        - "is_active"
    CartItem:
      type: "object"
