<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | RockerStore</title>

    <link rel="stylesheet"
          href="/vendor/bootstrap/bootstrap.min.css">

    <link rel="stylesheet"
          href="/css/style.css">

    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"
            defer></script>

    <script type="module" src="/js/auth.js"></script>
</head>

<body>

    <header class="site-header">
        <nav class="navbar container py-3">

            <a class="navbar-brand logo" href="/">
                ROCKER<span>STORE</span>
            </a>

            <a class="btn btn-outline-light" href="/">
                Voltar à loja
            </a>

        </nav>
    </header>

    <main class="auth-section">

        <div class="container">

            <div class="auth-card">

                <p class="hero-label">
                    BEM-VINDO DE VOLTA
                </p>

                <h1 class="h2 fw-bold mb-3">
                    Entrar na RockerStore
                </h1>

                <p class="text-secondary mb-4">
                    Acesse sua conta para acompanhar
                    seus pedidos e finalizar compras.
                </p>

                <div id="authMessage"
                     role="status"
                     aria-live="polite"
                     class="d-none"></div>

                <form id="loginForm">

                    <div class="mb-3">

                        <label for="email"
                               class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               class="form-control"
                               autocomplete="email"
                               required>

                    </div>

                    <div class="mb-4">

                        <label for="password"
                               class="form-label">
                            Senha
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               autocomplete="current-password"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-danger w-100"
                            id="authSubmit">
                        Entrar
                    </button>

                </form>

                <p class="text-center text-secondary mt-4 mb-0">

                    Ainda não possui uma conta?

                    <a href="/register.html"
                       class="auth-link">
                        Cadastre-se
                    </a>

                </p>

            </div>

        </div>

    </main>

</body>
</html>
