name: rockerstore-prod

services:
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./back
      dockerfile: Dockerfile

    image: rockerstore-api:prod
    restart: unless-stopped

    env_file:
      - ./back/.env

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

    volumes:
      - product_images:/var/www/html/storage/app/public

    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./front
      dockerfile: Dockerfile

    restart: unless-stopped

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api
      - front

volumes:
  mysql_data:
  product_images:
